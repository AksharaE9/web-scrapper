version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=leadcore
      - POSTGRES_PASSWORD=leadcore
      - POSTGRES_DB=leadcore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadcore -d leadcore"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://leadcore:leadcore@db:5432/leadcore}
      - DATABASE_URL_DIRECT=${DATABASE_URL_DIRECT:-postgresql://leadcore:leadcore@db:5432/leadcore}
      - CONTACT_EMAIL=${CONTACT_EMAIL}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - with-llm

volumes:
  ollama_data:
  postgres_data:
