[project]
name = "leadcore-zero"
version = "2.0.0"
description = "Graph-engineered, keyless, local-first lead intelligence scraper"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.3",

    # Database
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",  # Alembic dependency only

    # Agent graph + checkpointing
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",

    # Data processing
    "duckdb>=1.1.0",
    "shapely>=2.0.0",
    "pygeohash>=2.0.0",

    # Entity resolution
    "splink>=4.0.0",
    "rapidfuzz>=3.9.0",

    # Embeddings (ONNX, CPU, no PyTorch)
    "fastembed>=0.3.0",

    # Web crawling & extraction
    "scrapling>=0.4.0",
    "extruct>=0.17.0",
    "httpx>=0.27.0",

    # Phone / email / domain validation
    "phonenumbers>=8.13.0",
    "email-validator>=2.2.0",
    "dnspython>=2.6.0",

    # Retry / reliability
    "tenacity>=8.5.0",

    # Data export
    "openpyxl>=3.1.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
llm = [
    "ollama>=0.3.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",           # for TestClient
    "respx>=0.21.0",           # HTTP mocking
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ASYNC"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
base_url = "http://localhost:5174"

