definition: >
  A K-12 formal educational institution providing primary, upper-primary, or secondary/
  higher-secondary schooling (Classes 1–12). Affiliated to CBSE, ICSE, State Boards,
  IGCSE or equivalent. Does NOT grant university degrees. Distinct from degree colleges,
  coaching centres, preschools, and vocational academies.
