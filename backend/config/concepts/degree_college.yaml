definition: >
  A formal degree-granting higher education institution affiliated to a university
  and offering bachelor's (UG) or postgraduate (PG) programmes in arts, science,
  commerce, engineering, medicine, management, or law. Grants degrees recognised by
  UGC/AICTE. NOT a K-12 school, vocational academy, or coaching centre.
